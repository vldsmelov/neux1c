[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "core/migrations",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["core", "config"]
omit = [
    "core/migrations/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
